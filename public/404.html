<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Page Not Found (404) | MSKDevHub</title>
  <link rel="icon" href="/assets/images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    :root { --bg: #1a1a2e; --fg: #f5f5f5; --accent: #6c63ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg); text-align: center;
      font-family: 'Jost', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 2rem;
    }
    .wrap { max-width: 34rem; }
    .logo { width: 72px; height: 72px; margin-bottom: 1.5rem; }
    .code { font-size: clamp(4rem, 18vw, 8rem); font-weight: 800; line-height: 1; color: var(--accent); }
    h1 { font-size: 1.5rem; margin: 0.5rem 0 1rem; }
    p { color: #c6c6d8; line-height: 1.6; }
    .actions { margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;
      padding: 0.85rem 1.5rem; border-radius: 50px; font-weight: 600;
      background: var(--accent); color: #fff;
    }
    a.btn.secondary { background: transparent; color: var(--fg); border: 1px solid rgba(255,255,255,0.3); }
  </style>
</head>

<body>
  <div class="wrap">
    <img src="/assets/images/logo.webp" alt="MSKDevHub Logo" class="logo" width="72" height="72" />
    <div class="code">404</div>
    <h1>This page could not be found</h1>
    <p>The page you were looking for may have been moved, renamed, or never existed. Let's get you back on track.</p>
    <div class="actions">
      <a href="/" class="btn"><i class="ri-home-4-line"></i> Back to Home</a>
      <a href="/projects/" class="btn secondary"><i class="ri-folder-3-line"></i> View Projects</a>
    </div>
  </div>
</body>

</html>
