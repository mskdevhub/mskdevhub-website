<link rel="stylesheet" href="/assets/css/switcher.css">
  <div class="style-switcher" id="style-switcher">
    <h2 class="style-switcher-title">Style Switcher</h2>

    <div class="style-switcher-item">
      <h3 class="style-switcher-subtitle">Colors</h3>
      <div class="style-switcher-colors">
        <span class="style-switcher-color active-color" style="--hue:210">
          <i class="ri-check-line"></i>
        </span>
        <span class="style-switcher-color " style="--hue:260">
          <i class="ri-check-line"></i>
        </span>
        <span class="style-switcher-color" style="--hue:345">
          <i class="ri-check-line"></i>
        </span>
        <span class="style-switcher-color" style="--hue:165">
          <i class="ri-check-line"></i>
        </span>
        <span class="style-switcher-color" style="--hue:65">
          <i class="ri-check-line"></i>
        </span>
        <span class="style-switcher-color" style="--hue:15">
          <i class="ri-check-line"></i>
        </span>
      </div>
    </div>

    <div class="style-switcher-item">
      <h3 class="style-switcher-subtitle">Theme</h3>
      <div class="style-switcher-themes">
        <div class="style-switcher-theme">
          <input type="radio" class="style-switcher-input" name="body-theme" value="light" checked="true"
            id="light-theme">
          <label for="light-theme" class="style-switcher-label">Light</label>
        </div>
        <div class="style-switcher-theme">
          <input type="radio" class="style-switcher-input" name="body-theme" value="dark" id="dark-theme">
          <label for="dark-theme" class="style-switcher-label">Dark</label>
        </div>
      </div>
    </div>
    <div class="style-switcher-close" id="switcher-close" role="button" tabindex="0" aria-label="Close Style Switcher">
      <i class="ri-close-line" aria-hidden="true"></i>
    </div>
  </div>

<script src="/assets/js/switcher.js"></script>
