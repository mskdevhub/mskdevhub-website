<link rel="stylesheet" href="/assets/css/contact.css">
<section class="contact section " id="contact">
  <h2 class="section-title reveal" data-title="Let's Talk About Ideas">Contact Me</h2>
  <div class="contact-container container grid">
    <div class="contact-content reveal delay-100">
      <div class="contact-card">
        <span class="contact-icon">
          <i class="ri-map-2-line" aria-hidden="true"></i>
        </span>
        <div>
          <h3 class="contact-title">Address</h3>
          <p class="contact-data">Village &amp; Postoffice Mekhband,KPK,Pakistan</p>
        </div>
      </div>
      <div class="contact-card">
        <span class="contact-icon">
          <i class="ri-user-3-line" aria-hidden="true"></i>
        </span>
        <div>
          <h3 class="contact-title">Freelance</h3>
          <p class="contact-data">Available Right Now on Website</p>
        </div>
      </div>
      <div class="contact-card">
        <span class="contact-icon">
          <i class="ri-mail-line" aria-hidden="true"></i>
        </span>
        <div>
          <h3 class="contact-title">Email</h3>
          <p class="contact-data">mskreallabs@gmail.com</p>
        </div>
      </div>
      <div class="contact-card">
        <span class="contact-icon">
          <i class="ri-contacts-book-2-line" aria-hidden="true"></i>
        </span>
        <div>
          <h3 class="contact-title">Phone</h3>
          <p class="contact-data">+92 311 5635536</p>
        </div>
      </div>
    </div>
    <form action="" class="contact-form grid reveal delay-200" id="contact-form">
      <div class="contact-form-group grid">
        <div class="contact-form-div">
          <label for="contact-name" class="contact-form-label">Your Full Name <b>*</b></label>
          <input type="text" name="name" class="contact-form-input" id="contact-name">
        </div>
        <div class="contact-form-div">
          <label for="contact-email" class="contact-form-label">Your Email Address <b>*</b></label>
          <input type="email" name="email" class="contact-form-input" id="contact-email">
        </div>
      </div>
      <div class="contact-form-div">
        <label for="contact-subject" class="contact-form-label">Your Subject <b>*</b></label>
        <input type="text" name="subject" class="contact-form-input" id="contact-subject">
      </div>
      <div class="contact-form-div">
        <label for="contact-message" class="contact-form-label">Your Message <b>*</b></label>
        <textarea name="message" class="contact-form-input contact-form-area" id="contact-message"></textarea>
      </div>
      <div class="contact-submit">
        <span>* Accept the terms and conditions.</span>
        <button type="submit" class="btn">Send Message</button>
      </div>
      <p class="message" id="message"></p>
    </form>
    <div class="section-deco deco-left">
      <img src="/assets/images/shape-2.webp" alt="" class="shape" loading="lazy">
    </div>
  </div>
</section>

<script src="/assets/js/contact.js"></script>
